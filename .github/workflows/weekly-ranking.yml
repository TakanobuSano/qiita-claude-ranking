name: Weekly Qiita Claude Ranking

on:
  workflow_dispatch:
  # schedule:
    # 毎日 09:37 JST に実行
    # UTCでは 00:37
    # - cron: "37 0 * * *"

permissions:
  contents: write

jobs:
  fetch-ranking:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Qiita ranking script
        env:
          QIITA_ACCESS_TOKEN: ${{ secrets.QIITA_ACCESS_TOKEN }}
        run: |
          python fetch_ranking.py

      - name: Generate rising ranking
        run: |
          python generate_rising_ranking.py

      - name: Keep latest 30 days of output files
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import defaultdict
          import re


          def keep_latest_days(
              target_dir: Path,
              glob_pattern: str,
              regex_pattern: str,
              keep_count: int = 30,
          ) -> None:
              if not target_dir.exists():
                  print(f"skip: {target_dir} does not exist")
                  return

              pattern = re.compile(regex_pattern)
              files_by_date = defaultdict(list)

              for path in target_dir.glob(glob_pattern):
                  match = pattern.match(path.name)

                  if not match:
                      continue

                  date_text = match.group(1)
                  files_by_date[date_text].append(path)

              keep_dates = set(sorted(files_by_date.keys(), reverse=True)[:keep_count])

              for date_text, paths in files_by_date.items():
                  if date_text in keep_dates:
                      continue

                  for path in paths:
                      print(f"delete: {path}")
                      path.unlink()

              print(f"{target_dir} keep dates:", ", ".join(sorted(keep_dates, reverse=True)))


          keep_latest_days(
              target_dir=Path("output"),
              glob_pattern="qiita_claude_ranking_*.*",
              regex_pattern=r"^qiita_claude_ranking_(\d{8})\.(md|csv)$",
              keep_count=30,
          )

          keep_latest_days(
              target_dir=Path("output/rising"),
              glob_pattern="qiita_claude_rising_*.*",
              regex_pattern=r"^qiita_claude_rising_(\d{8})\.(md|csv)$",
              keep_count=30,
          )
          PY

      - name: Commit ranking outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A output/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Qiita Claude ranking outputs"
            git push
          fi

      - name: Update Qiita item
        env:
          QIITA_ACCESS_TOKEN: ${{ secrets.QIITA_ACCESS_TOKEN }}
          QIITA_ITEM_ID: ${{ secrets.QIITA_ITEM_ID }}
          QIITA_POST_PRIVATE: "false"
        run: |
          python update_qiita_item.py

      - name: Update Qiita rising item
        env:
          QIITA_ACCESS_TOKEN: ${{ secrets.QIITA_ACCESS_TOKEN }}
          QIITA_RISING_ITEM_ID: ${{ secrets.QIITA_RISING_ITEM_ID }}
          QIITA_POST_PRIVATE: "false"
        run: |
          if [ -z "$QIITA_RISING_ITEM_ID" ]; then
            echo "QIITA_RISING_ITEM_ID is not set. Skip updating rising ranking item."
            exit 0
          fi

          python update_qiita_rising_item.py

      - name: Check Teams posting day
        id: teams_day
        run: |
          day_of_week=$(TZ=Asia/Tokyo date +%u)

          echo "JST day_of_week=${day_of_week}"

          if [ "$day_of_week" = "3" ]; then
            echo "should_post=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_post=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post ranking summary to Teams
        if: steps.teams_day.outputs.should_post == 'true'
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          python post_to_teams.py
